image: ghcr.io/trevorswanson/composecd
# Defaults to the chart's appVersion.
tag: ""
port: 8080
logLevel: info

# Host paths mounted read-only into the container, e.g. credentials referenced
# by config.repositories or Host tlsCertPath, and ~/.ssh for ssh:// hosts.
extraVolumes: []
#  - /opt/composecd/secrets:/run/secrets:ro
#  - /root/.ssh:/root/.ssh:ro

# composecd.yaml. dataDir and listen are set by the chart.
config:
  # Mount the identity via extraVolumes before enabling encrypted valueFiles.
  # sopsAgeKeyFile: /run/secrets/sops-age-key
  # Read secrets from Infisical with a Universal Auth machine identity (mount
  # the client secret via extraVolumes), or use tokenFile instead.
  # infisical:
  #   clientID: YOUR_CLIENT_ID
  #   clientSecretFile: /run/secrets/infisical-client-secret
  refreshInterval: 3m
  root:
    repoURL: https://git.example.lan/me/homelab.git
    targetRevision: main
    path: composecd
  repositories: []
  auth: {}
