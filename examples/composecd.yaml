# composecd's own configuration. Everything else (hosts, applications) lives in
# Git, under root.path of root.repoURL.
# Open this address for the embedded UI: /apps, /hosts, /windows, /operations, /settings.
# Reverse proxies must allow long-lived SSE and disable buffering for /events and log endpoints.
listen: ":8080"
dataDir: /var/lib/composecd
refreshInterval: 3m
concurrency: 4

# Optional SOPS-encrypted valueFiles; mount your own age identity read-only here.
# sopsAgeKeyFile: /run/secrets/sops-age-key

root:
  repoURL: https://git.example.lan/me/homelab.git
  targetRevision: main
  path: composecd

# Credentials, matched by the longest URL prefix. Secrets are read from files.
repositories:
  - url: https://git.example.lan/
    username: composecd
    passwordFile: /run/secrets/git-token
  # - url: git@github.com:me/
  #   sshKeyFile: /run/secrets/github-deploy-key
  #   knownHostsFile: /etc/composecd/known_hosts

# Push webhooks from Gitea, Forgejo, GitHub or GitLab trigger a refresh.
# webhook:
#   secretFile: /run/secrets/webhook-secret

# Where events go. See the README for the event names.
# notifications:
#   - name: phone
#     type: ntfy
#     url: https://ntfy.sh/my-homelab
#   - name: chat
#     type: discord
#     urlFile: /run/secrets/discord-webhook
#     events: [sync-failed, self-healed, prune]

auth:
  # With no tokenFile, composecd generates <dataDir>/admin-token on first start.
  # tokenFile: /run/secrets/composecd-token
  disabled: false
  # Sign in to the web page with an OpenID Connect provider.
  # oidc:
  #   issuer: https://auth.example.lan/application/o/composecd/
  #   clientID: composecd
  #   clientSecretFile: /run/secrets/oidc-secret
  #   redirectURL: https://composecd.example.lan/auth/callback
  #   adminGroups: [homelab-admins]
  #   readonlyGroups: [homelab-users]
