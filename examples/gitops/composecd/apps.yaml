# whoami follows Git automatically: every commit that changes what it renders
# is deployed within a refresh interval.
apiVersion: composecd/v1alpha1
kind: Application
metadata:
  name: whoami
  labels:
    tier: apps
spec:
  source:
    path: charts/whoami
    values:
      replicas: 1
  destination:
    host: nas
  syncPolicy:
    automated:
      prune: true       # uninstall it if it's removed from Git (volumes are kept)
      selfHeal: true    # recreate containers someone removed or changed by hand
    options:
      wait: true
      timeout: 2m
    retry:              # retry a failed sync: after 30s, 1m, 2m
      limit: 3
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
---
# dashboard is synced by hand ("composecd app sync dashboard"); composecd still
# shows when Git and the host differ.
apiVersion: composecd/v1alpha1
kind: Application
metadata:
  name: dashboard
spec:
  # Only synced automatically once whoami is Synced and Healthy (this one is
  # manual, so it only documents the order).
  dependsOn: [whoami]
  source:
    path: charts/dashboard
    valueFiles:
      - values-nas.yaml
  destination:
    host: nas
