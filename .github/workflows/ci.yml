name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w on the files above"; exit 1; }
      - name: go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./... && go vet -tags integration ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            go test ./...
          else
            go test -race -coverprofile=coverage.out ./...
          fi
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  # macOS runners are sometimes unavailable for hours. ci-ok doesn't wait for
  # this job to start; it holds only when the job runs and fails.
  test-macos:
    name: test (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: docker version && docker compose version && git version
      - name: Install pinned SOPS for encrypted-values integration tests
        run: |
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64 -o /tmp/sops
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  /tmp/sops" | sha256sum -c -
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
      - name: integration tests (real Docker engine)
        run: go test -tags integration -run Integration -v -timeout 15m ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: check
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: build --snapshot --clean --single-target

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build the container image
        run: docker build --build-arg VERSION=ci -t composecd:ci . && docker run --rm composecd:ci version && docker run --rm --entrypoint sops composecd:ci --version

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: copy the example GitOps repository into its own checkout
        run: cp -R examples/gitops "$RUNNER_TEMP/gitops" && git -C "$RUNNER_TEMP/gitops" init --quiet
      - uses: ./
        with:
          working-directory: ${{ runner.temp }}/gitops
          compose: "true"
          output-dir: ${{ runner.temp }}/rendered
      - run: test -s "$RUNNER_TEMP/rendered/whoami.yaml"

  # The single check to require in branch protection: matrix job names change
  # with the matrix, this one doesn't.
  ci-ok:
    if: always()
    needs: [lint, test, integration, govulncheck, release-check, image, action]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read # read test-macos's state
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "a required job did not succeed"; exit 1; }
          done
      # test-macos isn't in needs, so a queue with no macOS runner can't hold
      # this job. Wait for it if it started; pass with a warning if it hasn't
      # started within the grace period; fail if it failed.
      - name: macOS tests passed or never started
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
          GRACE: 300 # seconds test-macos may stay queued after the other jobs finish
        run: |
          deadline=$(( $(date +%s) + GRACE ))
          while :; do
            if ! job=$(gh api --paginate "$JOBS" \
              --jq '.jobs[] | select(.name == "test (macos-latest)") | "\(.status) \(.conclusion // "-")"'); then
              echo "reading the run's jobs failed; retrying"
              sleep 20
              continue
            fi
            status=${job%% *} conclusion=${job#* }
            echo "test (macos-latest): ${status:-missing} ${conclusion}"
            case "$status" in
              completed)
                case "$conclusion" in
                  success|skipped) exit 0 ;;
                  *) echo "test (macos-latest) $conclusion"; exit 1 ;;
                esac ;;
              in_progress) ;; # started: wait for its result
              "") echo "::warning::test (macos-latest) not found in this run"; exit 0 ;;
              *) # queued, waiting or pending: no runner has picked it up
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "::warning::test (macos-latest) never started (no macOS runner); passing without it"
                  exit 0
                fi ;;
            esac
            sleep 20
          done

  # Every merge to main refreshes the dev image. Versioned images and GitHub
  # Releases come only from v* tags (release.yml).
  dev-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-ok]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io/trevorswanson/composecd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/composecd
          flavor: latest=false
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=dev-${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
